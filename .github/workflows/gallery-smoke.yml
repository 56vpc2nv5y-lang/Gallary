name: Gallery runtime smoke check
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "data/photos.js"
      - "data/photos.json"
      - "scripts/check_gallery_runtime.mjs"
      - "scripts/check_ambience_runtime.mjs"
      - "scripts/browser_probe.js"
      - ".github/workflows/gallery-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "data/photos.js"
      - "data/photos.json"
      - "scripts/check_gallery_runtime.mjs"
      - "scripts/check_ambience_runtime.mjs"
      - ".github/workflows/gallery-smoke.yml"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test the complete gallery initialization
        run: node scripts/check_gallery_runtime.mjs
      - name: Smoke test seasonal particles and interaction controls
        run: node scripts/check_ambience_runtime.mjs
      - name: Headless Chrome checks the actually rendered photo wall and ambience
        shell: bash
        run: |
          python3 -m http.server 8055 --bind 127.0.0.1 >/tmp/gallery-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chrome/Chromium binary on runner"; exit 1
          fi
          # Serve a temporary test page. The public index remains unchanged.
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          fs.writeFileSync('__gallery_probe.html',html.replace('</body>',
            '<script src="scripts/browser_probe.js"></script></body>'));
          NODE
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8055/__gallery_probe.html > /tmp/gallery-dom.html 2>/tmp/gallery-chrome.log || {
            tail -40 /tmp/gallery-chrome.log; exit 1;
          }
          grep -q 'class="photo-card' /tmp/gallery-dom.html || { echo "Photos did not render"; exit 1; }
          grep -q 'class="studio-disclosure" open' /tmp/gallery-dom.html || { echo "Scrapbook is not visible"; exit 1; }
          grep -q 'gallery-probe:visible=true' /tmp/gallery-dom.html || { echo "Particle canvas is still hidden by CSS"; exit 1; }
          grep -Eq 'pixels=[1-9][0-9]*' /tmp/gallery-dom.html || { echo "Particle canvas is visible but nothing was painted"; exit 1; }
          grep -q 'moment=true' /tmp/gallery-dom.html || { echo "Photo reassembly was not initialized"; exit 1; }
          grep -q 'played=true' /tmp/gallery-dom.html || { echo "The reassembly click did not start animation"; exit 1; }
          echo "Browser render passed: gallery, visible painted particles, and click-to-play photo tiles."

