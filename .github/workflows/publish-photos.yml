name: Publish newly uploaded photos
on:
  push:
    branches: [main]
    paths:
      - "imports/**"
      - "assets/photos/**"
      - "data/photos.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out photo journal
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Unpack one-ZIP photo imports
        run: python scripts/unpack_photo_imports.py
      - name: Index new photos with curated metadata
        run: python scripts/sync_photos.py
      - name: Commit published photos and catalogs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos data/photos.json data/photos.js
          git rm -f --ignore-unmatch imports/*.zip || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish photo pack and refresh gallery"
            git push
          else
            echo "No changes to publish."
          fi
